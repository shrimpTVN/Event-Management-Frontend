name: PR Test & Verification

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

# Cancel previous runs for the same PR branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build
    runs-on: ubuntu-latest
    # Skip running checks on draft pull requests
    if: github.event.pull_request.draft != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install clean dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & component tests (Vitest)
        run: npm test

      - name: Build project (Vite)
        run: npm run build
